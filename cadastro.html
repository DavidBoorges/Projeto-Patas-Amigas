<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <header>
        <h1>ONG Patas Amigas</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
                <li><a href="doacao.html">Faça sua Doação</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Seja um Voluntário ou Membro</h2>
            <p>Preencha o formulário abaixo para fazer parte da nossa equipe de apoio aos animais.</p>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <div>
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                    </div>

                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>

                    <div>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00">
                    </div>

                    <div>
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Como quer ajudar?</legend>

                    <div>
                        <label for="tipo">Tipo de Participação:</label>
                        <select id="tipo" name="tipo" required>
                            <option value="">Selecione...</option>
                            <option value="voluntario">Voluntário de Campo (Feiras e Resgates)</option>
                            <option value="lar-temporario">Lar Temporário</option>
                            <option value="membro">Membro Mantenedor</option>
                        </select>
                    </div>
                </fieldset>

                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Patas Amigas. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
